name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - shell: bash
        run: rustc --version | grep -q '^rustc 1\.98\.1 '
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tests/consumer-service/Cargo.toml -- --check
      - run: cargo xtask inventory --check
      - run: cargo xtask docs
      - run: cargo xtask matrix
      - run: cargo xtask arch
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check --workspace --all-targets --all-features --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - shell: bash
        run: rustc --version | grep -q '^rustc 1\.98\.1 '
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo xtask consumer
      - run: cargo xtask demo
      - run: cargo xtask e2e

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Override rust-toolchain.toml so the MSRV job cannot silently run the pinned stable toolchain.
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@9d8ce8d04e0f46cc2c817f1369e4bd480df4ccc6 # 1.85.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustc --version | grep -q '^rustc 1\.85\.0 '
      - run: cargo check --workspace --all-targets --locked

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - shell: bash
        run: rustc --version | grep -q '^rustc 1\.98\.1 '
      - run: cargo package -p rust-cordis-core -p rust-cordis-abi -p rust-cordis-host -p rust-cordis-macros -p rust-cordis-sdk --no-verify --locked
