name: nightly-soak

on:
  schedule:
    # 02:17 China Standard Time (UTC+8); avoid the top-of-hour scheduler spike.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: Soak cycles (positive integer)
        required: false
        default: '1000000'
        type: string

permissions:
  contents: write

concurrency:
  group: nightly-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run soak
        timeout-minutes: 170
        shell: bash
        env:
          CYCLES: ${{ github.event.inputs.cycles || '1000000' }}
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          case "$CYCLES" in
            ''|*[!0-9]*)
              printf 'cycles must be a positive integer, got %q\n' "$CYCLES" >&2
              exit 2
              ;;
          esac
          if ((10#$CYCLES < 1)); then
            printf 'cycles must be a positive integer, got %s\n' "$CYCLES" >&2
            exit 2
          fi
          {
            printf 'nightly-soak run=%s commit=%s cycles=%s started=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SHA" "$CYCLES" "$(date -u +%FT%TZ)"
            rustc -vV
            printf 'cargo-lock-sha256=%s\n' "$(sha256sum Cargo.lock | cut -d' ' -f1)"
            cargo xtask soak "$CYCLES"
          } 2>&1 | tee soak.log
      - name: Run dhat staged-load profile
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask dhat 2>&1 | tee dhat.log
      - name: Run miri on rust-cordis-abi
        if: success()
        shell: bash
        env:
          # Pin nightly date to avoid spurious failures from upstream nightly regressions.
          MIRI_TOOLCHAIN: nightly-2026-11-20
          # Plugin descriptors and HostApi test fixtures intentionally Box::leak 'static memory.
          MIRIFLAGS: -Zmiri-ignore-leaks
        run: |
          set -euo pipefail
          rustup toolchain install "$MIRI_TOOLCHAIN" --component miri --no-self-update
          cargo +"$MIRI_TOOLCHAIN" miri test -p rust-cordis-abi --locked
      - name: Upload soak log
        if: ${{ always() && hashFiles('soak.log') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-log-${{ github.run_id }}-c${{ github.event.inputs.cycles || '1000000' }}
          path: soak.log
          if-no-files-found: error
          retention-days: 90
      - name: Upload dhat log
        if: ${{ always() && hashFiles('dhat.log') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dhat-log-${{ github.run_id }}
          path: dhat.log
          if-no-files-found: error
          retention-days: 90
      - name: Publish soak log to nightly-soak release
        if: ${{ always() && hashFiles('soak.log') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLES: ${{ github.event.inputs.cycles || '1000000' }}
        run: |
          set -euo pipefail
          if ! gh release view nightly-soak >/dev/null 2>&1; then
            gh release create nightly-soak \
              --title "nightly-soak logs" \
              --notes "Rolling long-term storage for nightly soak logs. Assets are unique per run."
          fi
          asset="soak-log-${GITHUB_RUN_ID}-c${CYCLES}.log"
          cp soak.log "$asset"
          gh release upload nightly-soak "$asset" --clobber
