name: compat-historical

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consume:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Consume historical formal seals
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($version in @('0.1.0', '0.1.1', '0.1.2')) {
            $archive = "dist/cordis-$version-formal.tar.gz"
            gh release download "v$version" --pattern "cordis-$version-formal.tar.gz" --dir dist --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar -xzf $archive -C dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo xtask seal-consume "dist/cordis-$version-formal"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
